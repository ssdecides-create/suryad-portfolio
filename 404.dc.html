<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Inter:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; background: #120A06; }
    * { box-sizing: border-box; }
    a { color: #F67C29; }
    a:hover { color: #FFA35C; }
    a, button { transition: color 0.3s ease, background-color 0.35s ease, border-color 0.3s ease, transform 0.35s cubic-bezier(.16,.84,.44,1), box-shadow 0.35s cubic-bezier(.16,.84,.44,1); }
    :focus-visible { outline: 2px solid #F67C29; outline-offset: 3px; border-radius: 4px; }
    @keyframes nf-glow { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
    @keyframes nf-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes nf-pulse { 0% { box-shadow: 0 0 0 0 rgba(246,124,41,0.5); } 100% { box-shadow: 0 0 0 10px rgba(246,124,41,0); } }
    .nf-glow { animation: nf-glow 5s ease-in-out infinite; }
    .nf-num { animation: nf-float 6s ease-in-out infinite; }
    .nf-dot-off { animation: nf-pulse 1.6s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { .nf-glow, .nf-num, .nf-dot-off { animation: none; } }
  </style>
  <script src="./opt/net-status.js"></script>
  <style>@media (max-width:640px){[data-nav-links]{display:none!important}[data-nav-burger]{display:inline-flex!important}[data-nav-pill]{width:100%!important;justify-content:space-between!important;flex-wrap:nowrap!important}}@media (min-width:641px){[data-nav-menu]{display:none!important}}</style>
  <script src="skeleton.js"></script>
<script src="opt/mail-picker.js" defer></script>
<style>@media (max-width:640px){[data-nav-id]{display:flex!important}}</style>
<style data-overscroll-fix="1">html,body{background:#120A06;overscroll-behavior-y:none}</style>
</helmet>
<div style="position:relative;min-height:100vh;background:#120A06;color:#E0DFBF;font-family:Inter,ui-sans-serif,sans-serif;overflow:hidden;display:flex;flex-direction:column">
  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 0% 0%, rgba(246,124,41,0.16) 0%, rgba(246,124,41,0) 70%)"></div>
  <div aria-hidden="true" class="nf-glow" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(40% 50% at 72% 58%, rgba(246,124,41,0.30) 0%, rgba(246,124,41,0.10) 45%, rgba(246,124,41,0) 72%)"></div>

  <div style="position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;padding:16px 16px 0">
    <nav data-nav-pill="1" style="width:fit-content;display:flex;align-items:center;gap:28px;row-gap:8px;flex-wrap:wrap;border-radius:100px;border:1px solid rgba(224,223,191,0.18);backdrop-filter:blur(14px);background:rgba(23,23,23,0.85);padding:8px 12px">
      <a href="./#top" style="display:flex;align-items:center;gap:10px;text-decoration:none">
        <img src="opt/web/logo.webp" alt="Surya" width="32" height="32" decoding="async" style="width:32px;height:32px;border-radius:50%;display:block"><span data-nav-id="1" style="display:none;flex-direction:column;line-height:1.15;min-width:0"><span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px;color:#F5F4E8;white-space:nowrap">Surya D</span><span style="font-family:Inter;font-weight:500;font-size:11.5px;color:#A8A8A8;white-space:nowrap">Lead Product Designer</span></span>
      </a>
      <div data-nav-links="1" style="display:flex;align-items:center;gap:clamp(14px,3vw,24px);flex-wrap:wrap;padding-right:4px">
        <a href="./#work" style="font-family:Inter;font-weight:500;font-size:14px;color:#E0DFBF;text-decoration:none" style-hover="color:#F67C29">Work</a>
        <a href="About.dc.html" style="font-family:Inter;font-weight:500;font-size:14px;color:#E0DFBF;text-decoration:none" style-hover="color:#F67C29">About me</a>
        <a href="Resume.dc.html" style="font-family:Inter;font-weight:500;font-size:14px;color:#E0DFBF;text-decoration:none" style-hover="color:#F67C29">Contact</a>
      </div>
      <button data-nav-burger="1" type="button" onClick="{{ toggleNav }}" aria-label="Toggle menu" style="display:none;align-items:center;justify-content:center;width:40px;height:40px;flex-shrink:0;border-radius:50%;border:1px solid rgba(224,223,191,0.25);background:transparent;color:#E0DFBF;cursor:pointer;padding:0">
        <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></sc-if>
        <sc-if value="{{ navClosed }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></sc-if>
      </button>
    </nav>
    <sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">
      <div data-nav-menu="1" style="margin-top:8px;width:100%;box-sizing:border-box;border-radius:24px;border:1px solid rgba(224,223,191,0.18);background:rgba(23,23,23,0.96);backdrop-filter:blur(14px);padding:10px;display:flex;flex-direction:column;gap:2px;box-shadow:0 20px 50px rgba(0,0,0,0.5)">
        <a href="./#work" onClick="{{ closeNav }}" style="display:block;font-family:Inter;font-weight:500;font-size:16px;color:#E0DFBF;text-decoration:none;padding:14px 16px;border-radius:14px" style-hover="background:rgba(224,223,191,0.06)">Work</a>
        <a href="About.dc.html" onClick="{{ closeNav }}" style="display:block;font-family:Inter;font-weight:500;font-size:16px;color:#E0DFBF;text-decoration:none;padding:14px 16px;border-radius:14px" style-hover="background:rgba(224,223,191,0.06)">About me</a>
        <a href="Resume.dc.html" onClick="{{ closeNav }}" style="display:block;font-family:Inter;font-weight:500;font-size:16px;color:#E0DFBF;text-decoration:none;padding:14px 16px;border-radius:14px" style-hover="background:rgba(224,223,191,0.06)">Contact</a>
      </div>
    </sc-if>
  </div>

  <main style="position:relative;z-index:3;flex:1;width:100%;max-width:1200px;margin:0 auto;padding:clamp(48px,8vw,96px) clamp(24px,6vw,72px);display:flex;align-items:center;gap:clamp(32px,6vw,80px);flex-wrap:wrap-reverse">
    <div style="flex:1 1 440px;min-width:0;max-width:600px">
      <div style="display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(224,223,191,0.18);border-radius:100px;padding:7px 14px 7px 12px;margin-bottom:28px;background:rgba(23,23,23,0.5)">
        <span class="{{ dotClass }}" style="width:8px;height:8px;border-radius:50%;background:{{ dotColor }};display:block"></span>
        <span style="font-family:Inter;font-weight:500;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#A89A8E">{{ statusLabel }}</span>
      </div>
      <h1 style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(2.6rem,5.6vw,4.5rem);line-height:1.04;letter-spacing:-0.025em;color:#F5F4E8;margin:0 0 22px;text-wrap:balance">{{ title }}<br><span style="color:#F67C29">{{ titleAccent }}</span></h1>
      <p style="font-family:Inter;font-size:clamp(1rem,1.35vw,1.15rem);line-height:1.65;color:#D6CEC5;max-width:500px;margin:0 0 36px;text-wrap:pretty">{{ body }}</p>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <sc-if value="{{ isOffline }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ retry }}" style="display:inline-flex;align-items:center;gap:8px;background:#F67C29;color:#171717;font-family:Inter;font-weight:600;font-size:14px;padding:13px 24px;border-radius:100px;border:none;cursor:pointer" style-hover="background:#FFA35C;transform:translateY(-2px);box-shadow:0 10px 26px rgba(246,124,41,0.35)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path></svg>
            {{ retryLabel }}
          </button>
        </sc-if>
        <a href="./" style="display:inline-flex;align-items:center;gap:8px;background:{{ homeBg }};color:{{ homeColor }};font-family:Inter;font-weight:600;font-size:14px;padding:13px 24px;border-radius:100px;border:1px solid {{ homeBorder }};text-decoration:none" style-hover="background:#FFA35C;border-color:#FFA35C;color:#171717;transform:translateY(-2px)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
          Back to home
        </a>
        <a href="./#work" style="display:inline-flex;align-items:center;gap:8px;background:transparent;color:#E0DFBF;font-family:Inter;font-weight:600;font-size:14px;padding:13px 24px;border-radius:100px;border:1px solid rgba(224,223,191,0.25);text-decoration:none" style-hover="border-color:#F67C29;color:#F67C29">See my work</a>
      </div>
    </div>
    <div aria-hidden="true" style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;position:relative;margin-left:clamp(-120px,-6vw,0px)">
      <div style="font-family:'Caveat',cursive;font-weight:600;font-size:clamp(24px,2.6vw,32px);color:#F67C29;transform:rotate(-8deg);margin-bottom:-6px;align-self:flex-start;margin-left:12%">{{ note }}</div>
      <div class="nf-num" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:{{ codeSize }};line-height:0.9;letter-spacing:-0.05em;padding:0.04em 0.12em 0.06em 0.04em;white-space:nowrap;color:transparent;background:linear-gradient(180deg,#FFB27A 0%,#F67C29 55%,rgba(246,124,41,0.35) 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 40px rgba(246,124,41,0.3))">{{ code }}</div>
    </div>
  </main>

  <div style="position:relative;z-index:3;text-align:center;padding:0 24px 24px;font-family:Inter;font-size:13px;color:rgba(245,244,232,0.5)">© 2026 Surya D. — Product Designer</div>
  <dc-import name="Letter" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;forceOffline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Preview&quot;}}">
class Component extends DCLogic {
  state = { offline: false, checking: false };
  componentDidMount() {
    const q = new URLSearchParams(location.search);
    const forced = q.get('reason') === 'offline';
    this.setState({ offline: forced || (typeof navigator !== 'undefined' && navigator.onLine === false) });
    this._on = () => this.setState({ offline: false });
    this._off = () => this.setState({ offline: true });
    window.addEventListener('online', this._on);
    window.addEventListener('offline', this._off);
  }
  componentWillUnmount() {
    window.removeEventListener('online', this._on);
    window.removeEventListener('offline', this._off);
  }
  retry = () => {
    this.setState({ checking: true });
    setTimeout(() => {
      if (navigator.onLine) {
        const back = new URLSearchParams(location.search).get('from');
        if (back) location.href = back; else if (history.length > 1) history.back(); else location.href = './';
      } else this.setState({ checking: false });
    }, 600);
  };
  toggleNav = () => this.setState(s => ({ navOpen: !(s && s.navOpen) }));
  closeNav = () => this.setState({ navOpen: false });
  renderVals() {
    const _nav = !!(this.state && this.state.navOpen);
    return Object.assign({}, this._baseVals(), { navOpen: _nav, navClosed: !_nav, toggleNav: this.toggleNav, closeNav: this.closeNav });
  }
  _baseVals() {
    const off = !!this.props.forceOffline || this.state.offline;
    return off ? {
      isOffline: true,
      code: 'Oops',
      codeSize: 'clamp(7rem,18vw,15rem)',
      note: 'signal lost…',
      statusLabel: 'You\u2019re offline',
      dotClass: 'nf-dot-off', dotColor: '#F67C29',
      title: 'Looks like the',
      titleAccent: 'connection dropped.',
      body: 'Check your Wi-Fi or mobile data, then try again. The page will be right where you left it.',
      retry: this.retry,
      retryLabel: this.state.checking ? 'Checking…' : 'Try again',
      homeBg: 'transparent', homeColor: '#E0DFBF', homeBorder: 'rgba(224,223,191,0.25)'
    } : {
      isOffline: false,
      code: '404',
      codeSize: 'clamp(7rem,18vw,15rem)',
      note: 'wrong turn?',
      statusLabel: 'Error 404 · Page not found',
      dotClass: '', dotColor: '#5FBE7C',
      title: 'This page took',
      titleAccent: 'a scenic detour.',
      body: 'The link might be broken, or the page may have moved. Let\u2019s get you back to something worth seeing.',
      retry: this.retry, retryLabel: 'Try again',
      homeBg: '#F67C29', homeColor: '#171717', homeBorder: '#F67C29'
    };
  }
}
</script>
</body>
</html>
